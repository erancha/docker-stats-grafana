# The stats pipeline: InfluxDB, Grafana and the consumer always; a local Redpanda broker and its
# console under the "redpanda" profile. Settings come from .env (.env.example documents each key).
# Every port is published on the loopback interface only: InfluxDB and the broker would otherwise
# be reachable from the network, the broker without any authentication.

# How a container reaches InfluxDB; the consumer writes with it and Grafana's datasource reads
# with it.
x-influxdb-access: &influxdb-access
  INFLUXDB_URL: http://influxdb:8086
  INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
  INFLUXDB_ORG: ${INFLUXDB_ORG}
  INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}

services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      # The dashboard looks at minutes and hours; a bounded bucket keeps the volume from filling
      # a small host's disk.
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      <<: *influxdb-access
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/docker-stats.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - monitoring
    depends_on:
      influxdb:
        condition: service_healthy

  redpanda:
    image: redpandadata/redpanda:v26.2.6
    container_name: redpanda
    profiles: ["redpanda"]
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:9092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=warn
    ports:
      - "127.0.0.1:9092:19092" # Kafka (external / host access)
      - "127.0.0.1:18082:18082" # HTTP Proxy (external)
      - "127.0.0.1:18081:18081" # Schema Registry (external)
      - "127.0.0.1:9644:9644" # Admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  redpanda-console:
    image: redpandadata/console:v3.14.0
    container_name: redpanda-console
    profiles: ["redpanda"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
    networks:
      - monitoring
    depends_on:
      redpanda:
        condition: service_healthy

  kafka-to-influxdb:
    build:
      context: ./consumer
    container_name: kafka-to-influxdb
    environment:
      <<: *influxdb-access
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC_1: ${KAFKA_TOPIC_1}
      KAFKA_TOPIC_2: ${KAFKA_TOPIC_2}
      KAFKA_GROUP_ID_SUFFIX: -local
    networks:
      - monitoring
    depends_on:
      influxdb:
        condition: service_healthy
      # Waited for only when the redpanda profile starts it; a remote broker has no service here.
      redpanda:
        condition: service_healthy
        required: false
    restart: unless-stopped

volumes:
  influxdb-data:
  influxdb-config:
  grafana-data:
  redpanda-data:

networks:
  monitoring:
    driver: bridge
