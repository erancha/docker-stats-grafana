[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["consumer.py", "stats_message.py", "tests"]

[[tool.mypy.overrides]]
module = ["kafka", "kafka.*", "influxdb_client", "influxdb_client.*"]
ignore_missing_imports = true
follow_imports = "skip"
